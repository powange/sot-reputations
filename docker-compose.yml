services:
  app:
    # Image construite par GitHub Actions (.github/workflows/publier-image.yml) et publiée sur
    # GHCR : le serveur ne construit plus rien, il télécharge. pull_policy: always -> chaque
    # redéploiement (webhook Portainer) récupère la dernière :main. Pour revenir en arrière,
    # remplacer :main par :sha-<commit>.
    image: ghcr.io/powange/sot-reputations:main
    pull_policy: always
    container_name: sot-reputations
    restart: unless-stopped
    ports:
      - "3015:3000"
    volumes:
      - sot-data:/app/data
    environment:
      # Fuseau du serveur : la tâche planifiée "release-notes:sync" tourne à 15h locale
      - TZ=Europe/Paris
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: proxy-network

volumes:
  sot-data:
    driver: local
