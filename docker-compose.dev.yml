services:
  app:
    image: node:24-alpine
    container_name: sot-reputations-dev
    working_dir: /app
    ports:
      - "3015:3000"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - nuxt_dev:/app/.nuxt
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - TZ=Europe/Paris
    # Même correctif que le Dockerfile : sharp (IPX) ne trouve pas libvips dans .output sur Alpine
    command: sh -c "npm install && npm run build && mkdir -p /tmp/vips-libs && find /app/.output -name 'libvips*.so*' -exec ln -sf {} /tmp/vips-libs/ \\; && LD_LIBRARY_PATH=/tmp/vips-libs node .output/server/index.mjs"

volumes:
  node_modules_dev:
    driver: local
  nuxt_dev:
    driver: local
